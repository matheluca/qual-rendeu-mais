<title>Qual Rendeu Mais?</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
  :root{
    /* papel frio, sem virar creme */
    --paper:#F1F2EE;
    --paper-2:#E9EBE4;    /* hover da linha */
    --paper-3:#D4D8CB;    /* trilho do eixo, sempre mais escuro que o hover */
    --paper-4:#C3C8B9;
    --ink:#101310;
    --ink-soft:#5C6259;
    --line:#CBCFC3;
    --accent:#1D34E8;          /* azul de tinta, só para estrutura e marcações */
    --up:#0B6E4F;
    --up-soft:#BFDDD0;
    --down:#BE2E1E;
    --down-soft:#F0CCC6;

    --f:"Archivo","Helvetica Neue",Arial,sans-serif;
    --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;

    --gutter:clamp(18px,5vw,72px);
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100dvh;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f);
    font-variation-settings:"wdth" 100;
    -webkit-font-smoothing:antialiased;
  }

  .folha{min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto auto}

  /* ---------- cabeçalho ---------- */
  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    padding:clamp(16px,2.6vh,26px) var(--gutter) clamp(12px,1.8vh,18px);
    border-bottom:1.5px solid var(--ink);
  }
  .masthead h1{
    margin:0;
    font-size:clamp(14px,2vw,18px);
    font-weight:700;
    font-variation-settings:"wdth" 112;
    letter-spacing:-.01em;
    text-transform:lowercase;
  }
  .masthead h1 span{color:var(--accent)}
  .placar{display:flex;gap:clamp(16px,2.5vw,30px)}
  .placar div{display:flex;align-items:baseline;gap:7px}
  .placar span{
    font-family:var(--f-mono);
    font-size:9.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .placar b{
    font-size:clamp(18px,2.4vw,26px);
    font-weight:800;
    font-variation-settings:"wdth" 118;
    font-variant-numeric:tabular-nums;
    line-height:.9;
  }

  /* ---------- a janela, protagonista ---------- */
  .janela{
    padding:clamp(22px,5vh,54px) var(--gutter) clamp(18px,3.5vh,36px);
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    align-items:end;
    gap:14px;
  }
  .eyebrow{
    grid-column:1/-1;
    margin:0 0 clamp(6px,1.4vh,14px);
    font-family:var(--f-mono);
    font-size:10px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .periodo{
    margin:0;
    font-size:clamp(38px,9.5vw,116px);
    font-weight:800;
    font-variation-settings:"wdth" 122;
    letter-spacing:-.035em;
    line-height:.86;
    font-variant-numeric:tabular-nums;
    text-wrap:balance;
  }
  .periodo span{display:block}
  .periodo i{font-style:normal;color:var(--accent);padding-left:.12em}
  .sub{
    margin:0;
    padding-bottom:.5em;
    font-family:var(--f-mono);
    font-size:clamp(10.5px,1.3vw,12.5px);
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
  }

  /* ---------- as duas linhas, mesmo eixo ---------- */
  .ringue{display:flex;flex-direction:column;justify-content:center;border-top:1px solid var(--line)}

  .linha{
    position:relative;
    appearance:none;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--line);
    font:inherit;
    color:inherit;
    text-align:left;
    cursor:pointer;
    width:100%;
    display:grid;
    grid-template-columns:minmax(140px,20%) minmax(0,1fr) clamp(118px,17%,212px);
    align-items:center;
    gap:clamp(14px,2.5vw,34px);
    padding:clamp(16px,3.2vh,34px) var(--gutter);
    transition:background .18s ease;
  }
  .linha::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:0;
    background:var(--accent);
    transition:width .18s ease;
  }
  .linha:hover:not(:disabled){background:var(--paper-2)}
  .linha:hover:not(:disabled)::before{width:6px}
  .linha:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
  .linha:disabled{cursor:default}
  .linha.venceu::before{width:6px;background:var(--ink)}

  .tipo{
    display:inline-block;
    font-family:var(--f-mono);
    font-size:9px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .nome{
    margin:0;
    font-size:clamp(21px,3.1vw,36px);
    font-weight:800;
    font-variation-settings:"wdth" 108;
    letter-spacing:-.02em;
    line-height:1;
    text-wrap:balance;
  }
  .cod{
    display:block;
    margin-top:6px;
    font-family:var(--f-mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }

  /* eixo compartilhado */
  .eixo{
    position:relative;
    height:clamp(30px,4.4vh,44px);
    background:var(--paper-3);
  }
  .barra{
    position:absolute;
    top:0;bottom:0;
    left:0;
    width:0;
    background:var(--up-soft);
    transition:width .7s cubic-bezier(.22,1,.36,1), left .7s cubic-bezier(.22,1,.36,1);
  }
  .linha.venceu .barra{background:var(--up)}
  .barra.neg{background:var(--down-soft)}
  .linha.venceu .barra.neg{background:var(--down)}
  .zero{
    position:absolute;
    top:-6px;bottom:-6px;
    width:1.5px;
    background:var(--ink);
  }
  .marcaCDI{
    position:absolute;
    top:-6px;bottom:-6px;
    width:1px;
    background:var(--accent);
    opacity:0;
    transition:opacity .3s ease;
  }
  .marcaCDI.on{opacity:1}
  .marcaCDI i{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--f-mono);
    font-style:normal;
    font-size:8.5px;
    letter-spacing:.12em;
    color:var(--accent);
  }

  /* número, protagonista da direita */
  .valor{text-align:right}
  .ret{
    font-size:clamp(22px,3.7vw,48px);
    font-weight:800;
    font-variation-settings:"wdth" 118;
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.04em;
    line-height:.9;
    color:var(--paper-4);
    transition:color .3s ease;
  }
  .ret.pos{color:var(--up)}
  .ret.neg{color:var(--down)}
  .mil{
    margin-top:7px;
    font-family:var(--f-mono);
    font-size:10px;
    color:var(--ink-soft);
    min-height:1.2em;
    white-space:nowrap;
  }

  /* ---------- veredito ---------- */
  .veredito{
    display:flex;
    align-items:center;
    gap:14px;
    min-height:clamp(52px,7.5vh,68px);
    padding:12px var(--gutter);
    border-top:1.5px solid var(--ink);
    background:var(--paper);
    opacity:0;
    transition:opacity .25s ease;
  }
  .veredito.on{opacity:1}
  .selo{
    flex:none;
    width:30px;height:30px;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:15px;
    font-weight:700;
    color:var(--paper);
    background:var(--ink);
  }
  .selo.ok{background:var(--up)}
  .selo.no{background:var(--down)}
  .veredito p{
    margin:0;
    font-family:var(--f-mono);
    font-size:clamp(11px,1.4vw,13px);
    line-height:1.5;
    color:var(--ink-soft);
  }
  .veredito b{color:var(--ink);font-weight:500}

  /* ---------- rodapé ---------- */
  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    padding:11px var(--gutter) 14px;
    border-top:1px solid var(--line);
    font-family:var(--f-mono);
    font-size:9.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
  }
  .foot button{
    appearance:none;background:none;border:none;padding:0;
    font:inherit;color:var(--accent);cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;
  }
  .foot button:hover{color:var(--ink)}

  /* ---------- fim ---------- */
  .over{
    position:fixed;
    inset:0;
    z-index:10;
    display:grid;
    place-items:center;
    padding:var(--gutter);
    background:var(--paper);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .over.show{opacity:1;pointer-events:auto}
  .over-inner{max-width:22ch}
  .over .rot{
    font-family:var(--f-mono);
    font-size:10px;
    letter-spacing:.24em;
    text-transform:uppercase;
    color:var(--accent);
    margin:0 0 10px;
  }
  .over h2{
    margin:0;
    font-size:clamp(40px,11vw,120px);
    font-weight:800;
    font-variation-settings:"wdth" 122;
    letter-spacing:-.04em;
    line-height:.85;
  }
  .over .placa{
    font-variant-numeric:tabular-nums;
    color:var(--accent);
  }
  .over p{
    margin:18px 0 0;
    font-family:var(--f-mono);
    font-size:12px;
    line-height:1.6;
    color:var(--ink-soft);
    max-width:34ch;
  }
  .over button{
    margin-top:26px;
    appearance:none;
    font-family:var(--f);
    font-size:12px;
    font-weight:700;
    font-variation-settings:"wdth" 112;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:var(--ink);
    border:1.5px solid var(--ink);
    color:var(--paper);
    padding:15px 30px;
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .over button:hover{background:var(--accent);border-color:var(--accent)}

  @media (max-width:820px){
    .janela{grid-template-columns:1fr}
    .sub{text-align:left;padding-bottom:0;white-space:normal}
    .linha{
      grid-template-columns:1fr auto;
      grid-template-areas:"quem valor" "eixo eixo";
      gap:10px 14px;
      padding:16px var(--gutter);
    }
    .quem{grid-area:quem}
    .valor{grid-area:valor}
    .eixo{grid-area:eixo;height:26px;margin-top:4px}
    .nome{font-size:clamp(19px,5.4vw,26px)}
    .ret{font-size:clamp(26px,8vw,38px)}
    .veredito{align-items:flex-start}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>

  <footer class="foot">

  </footer>
</div>

<div class="over" id="over">

    <button id="again" type="button">Jogar de novo</button>
  </div>
</div>

var CDI = ATIVOS[0];

var el = function(id){ return document.getElementById(id); };
var streakEl = el("streak"), bestEl = el("best");
var linhaA = el("linhaA"), linhaB = el("linhaB");
var veredito = el("veredito"), selo = el("selo"), vtexto = el("vtexto"), over = el("over");

var estado = { i:0, f:0, A:null, B:null, streak:0, best:0, recordeNovo:false, travado:true, vistos:[] };

/* ---------- números ---------- */
function retorno(ativo, i, f){ return ativo.v[f - ativo.i0] / ativo.v[i - ativo.i0] - 1; }
function cobre(ativo, i, f){ return ativo.i0 <= i && ativo.fim >= f; }

function modoDe(r){ return r >= 9 ? "x" : "p"; }   /* acima de +900% o número fica longo demais */
function fmt(r, modo){
  if (modo === "x") return "×" + (1 + r).toFixed(1).replace(".", ",");
  var x = r * 100;
  var casas = Math.abs(x) >= 100 ? 0 : 1;
  return (x >= 0 ? "+" : "") + x.toFixed(casas).replace(".", ",") + "%";
}
function pct(r){ return fmt(r, modoDe(r)); }
function reais(v){ return "R$ " + Math.round(v).toLocaleString("pt-BR"); }

function textoDuracao(i, f){
  var n = f - i;
  if (f === 13) n = 12 - i + 0.67;
  if (n === Math.round(n)) return n + (n === 1 ? " ano" : " anos");
  return n.toFixed(1).replace(".", ",") + " anos";
}

/* ---------- sorteio ---------- */
function sorteiaRodada(){
  for (var t = 0; t < 400; t++){
    var dur = 1 + Math.floor(Math.random() * 8);
    var i = Math.floor(Math.random() * (13 - dur + 1));
    var f = i + dur;
    if (!cobre(CDI, i, f)) continue;

    var pool = ATIVOS.filter(function(at){ return at !== CDI && cobre(at, i, f); });
    if (pool.length < 2) continue;

    var A = pool[Math.floor(Math.random() * pool.length)];
    var B = pool[Math.floor(Math.random() * pool.length)];
    if (A === B) continue;

    var par = [A.nome, B.nome].sort().join("|");
    if (estado.vistos.indexOf(par) !== -1) continue;

    if (Math.abs(retorno(A, i, f) - retorno(B, i, f)) < 0.06) continue;

    estado.vistos.push(par);
    if (estado.vistos.length > 40) estado.vistos.shift();
    return { i:i, f:f, A:A, B:B };
  }
  return null;
}

/* ---------- desenho ---------- */
function preenche(l, ativo){
  el("tipo" + l).textContent = ativo.tipo;
  el("nome" + l).textContent = ativo.nome;
  el("oque" + l).textContent = ativo.oque;
  var r = el("ret" + l);
  r.textContent = "?";
  r.className = "ret";
  el("leg" + l).textContent = "";
  var b = el("bar" + l);
  b.className = "barra";
  b.style.width = "0%";
  b.style.left = "50%";
  el("zero" + l).style.left = "50%";
  el("cdi" + l).classList.remove("on");
}

/* escala por log(1+r): segura o bitcoin sem achatar o resto */
function forca(r){ return Math.log(1 + Math.max(r, -0.999)); }

function desenhaEixo(rA, rB, rCDI){
  var vals = [forca(rA), forca(rB), forca(rCDI), 0];
  var maxPos = Math.max(0.0001, Math.max.apply(null, vals));
  var maxNeg = Math.max(0.0001, -Math.min.apply(null, vals));
  var zero = Math.max(0.05, Math.min(0.95, maxNeg / (maxNeg + maxPos)));

  ["A", "B"].forEach(function(l, k){
    var s = forca(k === 0 ? rA : rB);
    var barra = el("bar" + l);
    el("zero" + l).style.left = (zero * 100) + "%";
    if (s >= 0){
      barra.className = "barra";
      barra.style.left = (zero * 100) + "%";
      barra.style.width = ((1 - zero) * (s / maxPos) * 100) + "%";
    } else {
      var larg = zero * (-s / maxNeg);
      barra.className = "barra neg";
      barra.style.left = ((zero - larg) * 100) + "%";
      barra.style.width = (larg * 100) + "%";
    }
    var sc = forca(rCDI);
    var pos = sc >= 0 ? zero + (1 - zero) * (sc / maxPos) : zero - zero * (-sc / maxNeg);
    var m = el("cdi" + l);
    m.style.left = (pos * 100) + "%";
    m.classList.add("on");
  });
}

function giraRetorno(node, alvo, ms){
  var modo = modoDe(alvo), fim = fmt(alvo, modo);
  node.className = "ret " + (alvo >= 0 ? "pos" : "neg");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ node.textContent = fim; return; }
  var t0 = performance.now();
  (function passo(t){
    var k = Math.min(1, ((t || performance.now()) - t0) / ms);
    /* o formato é decidido pelo valor final, para o número não trocar de cara no meio */
    node.textContent = k < 1 ? fmt(alvo * (1 - Math.pow(1 - k, 3)), modo) : fim;
    if (k < 1) requestAnimationFrame(passo);
  })();
}

/* ---------- rodada ---------- */
function rodada(){
  var r = sorteiaRodada();
  if (!r){ encerra(true); return; }
  estado.i = r.i; estado.f = r.f; estado.A = r.A; estado.B = r.B;

  el("periodo").innerHTML = PONTOS[r.i] + ' <i>→</i> ' + PONTOS[r.f];
  el("duracao").textContent = textoDuracao(r.i, r.f) + " · mesma janela para os dois";

  preenche("A", r.A);
  preenche("B", r.B);
  linhaA.classList.remove("venceu");
  linhaB.classList.remove("venceu");
  linhaA.disabled = false;
  linhaB.disabled = false;
  veredito.classList.remove("on");
  estado.travado = false;
}

function responde(escolheuA){
  if (estado.travado) return;
  estado.travado = true;
  linhaA.disabled = true;
  linhaB.disabled = true;

  var rA = retorno(estado.A, estado.i, estado.f);
  var rB = retorno(estado.B, estado.i, estado.f);
  var rCDI = retorno(CDI, estado.i, estado.f);
  var acertou = escolheuA ? rA > rB : rB > rA;

  giraRetorno(el("retA"), rA, 800);
  giraRetorno(el("retB"), rB, 800);
  desenhaEixo(rA, rB, rCDI);
  el("legA").textContent = "R$ 1.000 → " + reais(1000 * (1 + rA));
  el("legB").textContent = "R$ 1.000 → " + reais(1000 * (1 + rB));
  (rA > rB ? linhaA : linhaB).classList.add("venceu");

  var venc = rA > rB ? estado.A : estado.B;
  selo.className = "selo " + (acertou ? "ok" : "no");
  selo.textContent = acertou ? "✓" : "✕";
  vtexto.innerHTML = (acertou ? "Certo. " : "Errou. ") + "<b>" + venc.nome + "</b> rendeu mais no período. " +
                     "O CDI fez <b>" + pct(rCDI) + "</b> na mesma janela.";
  veredito.classList.add("on");

  setTimeout(function(){ acertou ? avanca() : encerra(false); }, 2100);
}

function avanca(){
  estado.streak += 1;
  streakEl.textContent = estado.streak;
  if (estado.streak > estado.best){
    estado.best = estado.streak;
    estado.recordeNovo = true;
    bestEl.textContent = estado.best;
    try { localStorage.setItem("qrm-recorde", String(estado.best)); } catch (e) {}
  }
  rodada();
}

function encerra(semRodada){
  var rA = retorno(estado.A, estado.i, estado.f);
  var rB = retorno(estado.B, estado.i, estado.f);
  var venc = rA > rB ? estado.A : estado.B, perd = rA > rB ? estado.B : estado.A;

  el("overRot").textContent = semRodada ? "Acabou a base" : "Fim de jogo";
  el("overTitle").textContent = semRodada ? "Você viu tudo" : (estado.streak === 0 ? "Começou mal" : "Errou essa");
  el("overScore").textContent = estado.streak;
  el("overMsg").textContent = semRodada
    ? "Não há mais combinações inéditas para hoje."
    : venc.nome + " fez " + pct(Math.max(rA, rB)) + " contra " + pct(Math.min(rA, rB)) + " de " + perd.nome +
      " entre " + PONTOS[estado.i] + " e " + PONTOS[estado.f] + ". " +
      (estado.recordeNovo ? "Novo recorde." : "Seu recorde é " + estado.best + ".");
  over.classList.add("show");
  el("again").focus();
}

function comeca(){
  over.classList.remove("show");
  estado.streak = 0;
  estado.recordeNovo = false;
  estado.vistos = [];
  streakEl.textContent = "0";
  rodada();
}

linhaA.addEventListener("click", function(){ responde(true); });
linhaB.addEventListener("click", function(){ responde(false); });
el("again").addEventListener("click", comeca);
el("reset").addEventListener("click", comeca);

document.addEventListener("keydown", function(e){
  if (over.classList.contains("show")){ if (e.key === "Enter") comeca(); return; }
  if (e.key === "ArrowUp")   responde(true);
  if (e.key === "ArrowDown") responde(false);
});

try {
  var salvo = parseInt(localStorage.getItem("qrm-recorde") || "0", 10);
  if (!isNaN(salvo) && salvo > 0){ estado.best = salvo; bestEl.textContent = salvo; }
} catch (e) {}

comeca();
</script>
