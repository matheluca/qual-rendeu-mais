<title>Qual Rendeu Mais?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700;6..96,900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --ink:#0A0F16;
    --ink-2:#121A24;
    --ink-3:#1A2431;
    --brass:#C6A15B;
    --brass-dim:#8A7038;
    --paper:#EDE8DD;
    --mute:#8C97A8;
    --up:#4FB286;
    --down:#D8564C;
    --rule:rgba(198,161,91,.22);

    --f-display:"Bodoni Moda","Didot","Times New Roman",serif;
    --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
    --f-num:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(120% 80% at 50% -10%, #16202C 0%, rgba(10,15,22,0) 60%),
      repeating-linear-gradient(180deg, rgba(198,161,91,.045) 0 1px, rgba(0,0,0,0) 1px 34px),
      var(--ink);
    color:var(--paper);
    font-family:var(--f-body);
    -webkit-font-smoothing:antialiased;
  }

  .stage{min-height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto}

  /* ---------- placar ---------- */
  .board{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    padding:16px clamp(16px,4vw,40px) 14px;
    border-bottom:1px solid var(--rule);
  }
  .brand{
    font-family:var(--f-display);
    font-weight:900;
    font-size:clamp(15px,2.4vw,21px);
    margin:0;
  }
  .brand em{font-style:italic;color:var(--brass)}
  .scores{display:flex;gap:clamp(16px,3vw,32px);font-family:var(--f-num);font-variant-numeric:tabular-nums}
  .score{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .score span{
    font-family:var(--f-body);
    font-size:9.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--mute);
    white-space:nowrap;
  }
  .score b{font-size:clamp(17px,2.6vw,24px);font-weight:600;line-height:1}
  .score.streak b{color:var(--brass)}

  /* ---------- janela do tempo ---------- */
  .janela{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    padding:clamp(16px,3vh,30px) 20px clamp(12px,2vh,20px);
    text-align:center;
  }
  .janela .rotulo{
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .periodo{
    font-family:var(--f-display);
    font-weight:900;
    font-size:clamp(30px,6.5vw,60px);
    line-height:1;
    letter-spacing:.01em;
    display:flex;
    align-items:baseline;
    gap:.28em;
  }
  .periodo i{font-style:normal;color:var(--brass);font-size:.55em;transform:translateY(-.12em)}
  .duracao{
    font-family:var(--f-num);
    font-size:clamp(11px,1.6vw,13px);
    color:var(--mute);
    letter-spacing:.04em;
  }

  /* ---------- disputa ---------- */
  .disputa{
    position:relative;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:stretch;
    min-height:0;
    border-top:1px solid var(--rule);
  }
  .disputa::after{
    content:"";
    position:absolute;
    inset:0 auto 0 50%;
    width:1px;
    background:linear-gradient(180deg,transparent,var(--rule) 12%,var(--rule) 88%,transparent);
  }

  .lado{
    appearance:none;
    background:transparent;
    border:0;
    font:inherit;
    color:inherit;
    text-align:center;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(10px,1.8vh,20px);
    padding:clamp(20px,4vh,46px) clamp(14px,3vw,34px);
    transition:background .2s ease;
  }
  .lado:hover:not(:disabled){background:rgba(198,161,91,.06)}
  .lado:focus-visible{outline:2px solid var(--brass);outline-offset:-4px}
  .lado:disabled{cursor:default}
  .lado.venceu{background:rgba(79,178,134,.07)}

  .tipo{
    font-size:9.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--brass);
    border:1px solid var(--rule);
    border-radius:999px;
    padding:4px 11px;
  }
  .nome{
    font-family:var(--f-display);
    font-weight:700;
    font-size:clamp(21px,3.6vw,38px);
    line-height:1.06;
    margin:0;
    text-wrap:balance;
    max-width:15ch;
    min-height:2.12em;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .oque{
    font-size:clamp(9.5px,1.4vw,11.5px);
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--mute);
    margin:0;
    max-width:30ch;
    min-height:1.4em;
  }

  /* retorno */
  .retorno{
    font-family:var(--f-num);
    font-variant-numeric:tabular-nums;
    font-weight:600;
    font-size:clamp(26px,5vw,48px);
    line-height:1;
    letter-spacing:-.02em;
    color:var(--mute);
    min-height:1em;
    opacity:.45;
    transition:opacity .3s ease, color .3s ease;
  }
  .retorno.revelado{opacity:1}
  .retorno.pos{color:var(--up)}
  .retorno.neg{color:var(--down)}

  /* barra do retorno, escala compartilhada */
  .trilho{
    position:relative;
    width:min(330px,92%);
    height:14px;
    border:1px solid var(--rule);
    background:rgba(198,161,91,.05);
  }
  .zero{position:absolute;top:-4px;bottom:-4px;width:1px;background:rgba(237,232,221,.35)}
  .barra{
    position:absolute;
    top:0;bottom:0;
    width:0;
    background:linear-gradient(90deg, rgba(79,178,134,.55), var(--up));
    transition:width .7s cubic-bezier(.22,1,.36,1), left .7s cubic-bezier(.22,1,.36,1);
  }
  .barra.neg{background:linear-gradient(90deg, var(--down), rgba(216,86,76,.55))}
  .cdi{
    position:absolute;
    top:-6px;
    height:26px;
    width:1px;
    background:var(--brass);
    opacity:0;
    transition:opacity .3s ease;
  }
  .cdi.on{opacity:.95}
  .cdi::after{
    content:"CDI";
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--f-body);
    font-size:8px;
    letter-spacing:.14em;
    color:var(--brass);
  }
  .legenda{
    font-family:var(--f-num);
    font-size:10.5px;
    color:var(--mute);
    min-height:1.3em;
    letter-spacing:.02em;
  }

  .escolher{
    font-size:11px;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--paper);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:11px 22px;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .lado:hover:not(:disabled) .escolher{background:rgba(198,161,91,.14);border-color:var(--brass);color:var(--brass)}
  .lado:disabled .escolher{opacity:0}

  /* selo central */
  .vs{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:3;
    width:56px;
    aspect-ratio:1;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--ink);
    border:1px solid var(--brass-dim);
    font-family:var(--f-display);
    font-weight:900;
    font-style:italic;
    font-size:18px;
    color:var(--brass);
    box-shadow:0 0 0 7px var(--ink);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .3s ease, color .3s ease, border-color .3s ease;
  }
  .vs.verdict{transform:translate(-50%,-50%) scale(1.12);font-style:normal;font-size:23px;font-family:var(--f-body)}
  .vs.ok{background:var(--up);border-color:var(--up);color:#07130E}
  .vs.no{background:var(--down);border-color:var(--down);color:#1B0705}

  /* rodapé */
  .foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    padding:12px clamp(16px,4vw,40px) 16px;
    border-top:1px solid var(--rule);
    font-size:10px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--mute);
  }
  .foot button{
    appearance:none;background:none;border:none;padding:0;
    font:inherit;letter-spacing:.1em;color:var(--mute);
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  }
  .foot button:hover{color:var(--brass)}

  /* fim de jogo */
  .over{
    position:fixed;
    inset:0;
    z-index:10;
    display:grid;
    place-items:center;
    padding:24px;
    background:rgba(10,15,22,.94);
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
  }
  .over.show{opacity:1;pointer-events:auto}
  .over-inner{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:38ch}
  .over h2{
    font-family:var(--f-display);
    font-weight:900;
    font-size:clamp(30px,7vw,58px);
    margin:0;line-height:1;text-wrap:balance;
  }
  .over .final{
    font-family:var(--f-num);
    font-size:clamp(44px,12vw,86px);
    font-weight:600;
    color:var(--brass);
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .over p{margin:0;color:var(--mute);font-size:13px;line-height:1.6}
  .over .again{
    margin-top:8px;
    appearance:none;
    font-family:var(--f-body);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    background:var(--brass);
    border:1px solid var(--brass);
    border-radius:2px;
    color:#100A02;
    padding:14px 30px;
    cursor:pointer;
  }
  .over .again:hover{background:var(--paper);border-color:var(--paper);color:var(--ink)}

  @media (max-width:760px){
    .disputa{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
    .disputa::after{inset:50% 0 auto 0;width:auto;height:1px;background:linear-gradient(90deg,transparent,var(--rule) 12%,var(--rule) 88%,transparent)}
    .lado{gap:8px;padding:16px}
    .lado:first-child{padding-bottom:40px}
    .lado:last-child{padding-top:40px}
    .nome{max-width:20ch;font-size:clamp(19px,5.4vw,28px)}
    .retorno{font-size:clamp(24px,7vw,36px)}
    .vs{width:44px;font-size:15px;box-shadow:0 0 0 6px var(--ink)}
    .periodo{font-size:clamp(26px,9vw,44px)}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms !important;animation-duration:.01ms !important}
  }
</style>

<div class="stage">
  <header class="board">
    <h1 class="brand">Qual <em>rendeu mais</em>?</h1>
    <div class="scores">
      <div class="score streak"><span>Sequência</span><b id="streak">0</b></div>
      <div class="score"><span>Recorde</span><b id="best">0</b></div>
    </div>
  </header>

  <section class="janela">
    <span class="rotulo">Janela sorteada</span>
    <div class="periodo" id="periodo">— <i>→</i> —</div>
    <span class="duracao" id="duracao">—</span>
  </section>

  <main class="disputa">
    <button class="lado" id="ladoA" type="button">
      <span class="tipo" id="tipoA">—</span>
      <h2 class="nome" id="nomeA">—</h2>
      <p class="oque" id="oqueA">—</p>
      <div class="retorno" id="retA">?</div>
      <div class="trilho">
        <div class="barra" id="barA"></div>
        <div class="zero" id="zeroA"></div>
        <div class="cdi" id="cdiA"></div>
      </div>
      <div class="legenda" id="legA">&nbsp;</div>
      <span class="escolher">Rendeu mais</span>
    </button>

    <div class="vs" id="vs" aria-hidden="true">vs</div>

    <button class="lado" id="ladoB" type="button">
      <span class="tipo" id="tipoB">—</span>
      <h2 class="nome" id="nomeB">—</h2>
      <p class="oque" id="oqueB">—</p>
      <div class="retorno" id="retB">?</div>
      <div class="trilho">
        <div class="barra" id="barB"></div>
        <div class="zero" id="zeroB"></div>
        <div class="cdi" id="cdiB"></div>
      </div>
      <div class="legenda" id="legB">&nbsp;</div>
      <span class="escolher">Rendeu mais</span>
    </button>
  </main>

  <footer class="foot">
    <span>Retornos em reais, séries ajustadas · dados Mais Retorno · rentabilidade passada não é promessa</span>
    <button id="reset" type="button">Reiniciar</button>
  </footer>
</div>

<div class="over" id="over">
  <div class="over-inner">
    <h2 id="overTitle">Fim de jogo</h2>
    <div class="final" id="overScore">0</div>
    <p id="overMsg"></p>
    <button class="again" id="again" type="button">Jogar de novo</button>
  </div>
</div>

var CDI = ATIVOS[0];

var el = function(id){ return document.getElementById(id); };
var streakEl = el("streak"), bestEl = el("best"), vsEl = el("vs");
var ladoA = el("ladoA"), ladoB = el("ladoB"), over = el("over");

var estado = { a:0, b:0, A:null, B:null, streak:0, best:0, recordeNovo:false, travado:true, vistos:[] };

/* ---------- números ---------- */
function retorno(ativo, i, f){ return ativo.v[f - ativo.i0] / ativo.v[i - ativo.i0] - 1; }
function cobre(ativo, i, f){ return ativo.i0 <= i && ativo.fim >= f; }

function pct(r){
  var x = r * 100;
  var casas = Math.abs(x) >= 1000 ? 0 : Math.abs(x) >= 100 ? 0 : 1;
  return (x >= 0 ? "+" : "") + x.toFixed(casas).replace(".", ",") + "%";
}

function anosDe(i, f){
  var n = f - i;
  if (f === 13) n = 12 - i + 0.67;          /* último ponto é set/2026 */
  return n;
}
function textoDuracao(i, f){
  var n = anosDe(i, f);
  if (n === Math.round(n)) return n + (n === 1 ? " ano" : " anos");
  return n.toFixed(1).replace(".", ",") + " anos";
}

/* ---------- sorteio ---------- */
function sorteiaRodada(){
  for (var tentativa = 0; tentativa < 400; tentativa++){
    var dur = 1 + Math.floor(Math.random() * 8);        /* 1 a 8 anos */
    var i = Math.floor(Math.random() * (13 - dur + 1));
    var f = i + dur;
    if (!cobre(CDI, i, f)) continue;

    var pool = ATIVOS.filter(function(at){
      return cobre(at, i, f) && at !== CDI;
    });
    if (pool.length < 2) continue;

    var A = pool[Math.floor(Math.random() * pool.length)];
    var B = pool[Math.floor(Math.random() * pool.length)];
    if (A === B) continue;

    var par = [A.nome, B.nome].sort().join("|");
    if (estado.vistos.indexOf(par) !== -1) continue;

    var rA = retorno(A, i, f), rB = retorno(B, i, f);
    /* nada de empate técnico: a diferença precisa dar para sentir */
    if (Math.abs(rA - rB) < 0.06) continue;

    estado.vistos.push(par);
    if (estado.vistos.length > 40) estado.vistos.shift();
    return { i:i, f:f, A:A, B:B };
  }
  return null;
}

/* ---------- desenho ---------- */
function preenche(letra, ativo){
  el("tipo" + letra).textContent = ativo.tipo;
  el("nome" + letra).textContent = ativo.nome;
  el("oque" + letra).textContent = ativo.oque;
  el("ret" + letra).textContent = "?";
  el("ret" + letra).className = "retorno";
  el("bar" + letra).style.width = "0%";
  el("bar" + letra).className = "barra";
  el("cdi" + letra).classList.remove("on");
  el("leg" + letra).innerHTML = "&nbsp;";
}

/* escala compartilhada: comprimento por log(1+r), que segura o bitcoin sem achatar o resto */
function forca(r){ return Math.log(1 + Math.max(r, -0.999)); }

function posicionaBarras(rA, rB, rCDI){
  var vals = [rA, rB, rCDI].map(forca);
  var maxPos = Math.max(0.0001, Math.max.apply(null, vals.concat([0])));
  var maxNeg = Math.max(0.0001, -Math.min.apply(null, vals.concat([0])));
  /* o zero fica proporcional ao espaço que a parte negativa precisa */
  var zero = maxNeg / (maxNeg + maxPos);
  zero = Math.max(0.06, Math.min(0.94, zero));

  ["A", "B"].forEach(function(l, k){
    var r = k === 0 ? rA : rB;
    var s = forca(r);
    var barra = el("bar" + l);
    el("zero" + l).style.left = (zero * 100) + "%";
    if (s >= 0){
      barra.className = "barra";
      barra.style.left = (zero * 100) + "%";
      barra.style.width = ((1 - zero) * (s / maxPos) * 100) + "%";
    } else {
      var larg = zero * (-s / maxNeg);
      barra.className = "barra neg";
      barra.style.left = ((zero - larg) * 100) + "%";
      barra.style.width = (larg * 100) + "%";
    }
    var sc = forca(rCDI);
    var posCDI = sc >= 0 ? zero + (1 - zero) * (sc / maxPos) : zero - zero * (-sc / maxNeg);
    var marca = el("cdi" + l);
    marca.style.left = (posCDI * 100) + "%";
    marca.classList.add("on");
  });
}

function giraRetorno(node, alvo, ms){
  var f = pct(alvo);
  node.className = "retorno revelado " + (alvo >= 0 ? "pos" : "neg");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches){ node.textContent = f; return; }
  var t0 = performance.now();
  function passo(t){
    var k = Math.min(1, (t - t0) / ms);
    var atual = alvo * (1 - Math.pow(1 - k, 3));
    node.textContent = k < 1 ? pct(atual) : f;
    if (k < 1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}

/* ---------- rodada ---------- */
function rodada(){
  var r = sorteiaRodada();
  if (!r){ encerra(true); return; }
  estado.i = r.i; estado.f = r.f; estado.A = r.A; estado.B = r.B;

  var inicio = r.i === 13 ? "hoje" : PONTOS[r.i];
  var fim = PONTOS[r.f];
  el("periodo").innerHTML = inicio + ' <i>→</i> ' + fim;
  el("duracao").textContent = textoDuracao(r.i, r.f) + " · mesma janela para os dois";

  preenche("A", r.A);
  preenche("B", r.B);
  ladoA.classList.remove("venceu");
  ladoB.classList.remove("venceu");
  ladoA.disabled = false;
  ladoB.disabled = false;
  vsEl.className = "vs";
  vsEl.textContent = "vs";
  estado.travado = false;
}

function responde(escolheuA){
  if (estado.travado) return;
  estado.travado = true;
  ladoA.disabled = true;
  ladoB.disabled = true;

  var rA = retorno(estado.A, estado.i, estado.f);
  var rB = retorno(estado.B, estado.i, estado.f);
  var rCDI = retorno(CDI, estado.i, estado.f);
  var acertou = escolheuA ? rA > rB : rB > rA;

  giraRetorno(el("retA"), rA, 800);
  giraRetorno(el("retB"), rB, 800);
  posicionaBarras(rA, rB, rCDI);

  (rA > rB ? ladoA : ladoB).classList.add("venceu");
  el("legA").textContent = legenda(rA, rCDI);
  el("legB").textContent = legenda(rB, rCDI);

  setTimeout(function(){
    vsEl.className = "vs verdict " + (acertou ? "ok" : "no");
    vsEl.textContent = acertou ? "✓" : "✕";
    setTimeout(function(){ acertou ? avanca() : encerra(false); }, 1300);
  }, 850);
}

function legenda(r, rCDI){
  var mult = (1 + r);
  var txt = "R$ 1.000 viraram R$ " + Math.round(1000 * mult).toLocaleString("pt-BR");
  return txt + (r > rCDI ? " · ganhou do CDI" : " · perdeu do CDI");
}

function avanca(){
  estado.streak += 1;
  streakEl.textContent = estado.streak;
  if (estado.streak > estado.best){
    estado.best = estado.streak;
    estado.recordeNovo = true;
    bestEl.textContent = estado.best;
    try { localStorage.setItem("qrm-recorde", String(estado.best)); } catch (e) {}
  }
  setTimeout(rodada, 120);
}

function encerra(semRodada){
  var rA = retorno(estado.A, estado.i, estado.f);
  var rB = retorno(estado.B, estado.i, estado.f);
  var venc = rA > rB ? estado.A : estado.B;
  var perd = rA > rB ? estado.B : estado.A;
  var rv = Math.max(rA, rB), rp = Math.min(rA, rB);

  el("overTitle").textContent = semRodada ? "Acabaram as combinações"
                              : estado.streak === 0 ? "Começou mal" : "Errou essa";
  el("overScore").textContent = estado.streak;
  el("overMsg").textContent = semRodada
    ? "Você já viu tudo o que a base tem para hoje."
    : venc.nome + " fez " + pct(rv) + " contra " + pct(rp) + " de " + perd.nome +
      " entre " + PONTOS[estado.i] + " e " + PONTOS[estado.f] + ". " +
      (estado.recordeNovo ? "Novo recorde." : "Seu recorde é " + estado.best + ".");
  over.classList.add("show");
  el("again").focus();
}

function comeca(){
  over.classList.remove("show");
  estado.streak = 0;
  estado.recordeNovo = false;
  estado.vistos = [];
  streakEl.textContent = "0";
  rodada();
}

ladoA.addEventListener("click", function(){ responde(true); });
ladoB.addEventListener("click", function(){ responde(false); });
el("again").addEventListener("click", comeca);
el("reset").addEventListener("click", comeca);

document.addEventListener("keydown", function(e){
  if (over.classList.contains("show")){ if (e.key === "Enter") comeca(); return; }
  if (e.key === "ArrowLeft")  responde(true);
  if (e.key === "ArrowRight") responde(false);
});

try {
  var salvo = parseInt(localStorage.getItem("qrm-recorde") || "0", 10);
  if (!isNaN(salvo) && salvo > 0){ estado.best = salvo; bestEl.textContent = salvo; }
} catch (e) {}

comeca();
</script>
